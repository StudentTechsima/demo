<html>
	<head>
		<title>Ludo format</title>
		<style>
			#box1{
				height:200px;
				width:200px;
				border:50px solid #ff0;
				margin:auto;
			}
			
			#c1{
				height:50px;
				width:50px;
				border:2px solid #ff0;
				border-radius:50%;
				float:left;
				margin:20px;
			}
			#c2{
				height:50px;
				width:50px;
				border:2px solid #ff0;
				border-radius:50%;
				float:left;
				margin:20px;
			}
			#c3{
				height:50px;
				width:50px;
				border:2px solid #ff0;
				border-radius:50%;
				float:left;
				margin:20px;
			}
			#c4{
				height:50px;
				width:50px;
				border:2px solid #ff0;
				border-radius:50%;
				float:left;
				margin:20px;
			}
			
			#box2{
				height:0px;
				width:0px;
				border-left:150px solid #ff0;
				border-right:150px solid #f00;
				border-bottom:150px solid #00f;
				border-top:150px solid #049813;
				margin:20px auto;
			}
		</style>
	</head>
	<body>
		<div id="box1">
			<div id="c1"></div>
			<div id="c2"></div>
			<div id="c3"></div>
			<div id="c4"></div>
		</div>
		<div id="box2"></div>
	</body>
</html>
