<!doctype html>
<html>
	<head>
		<title>Layout1</title>
		<style>
			#outer{
				height:400px;
				width:600px;
				border:2px solid #000;
				margin:0px auto;
				
			}
			#top{
				height:198px;
				width:600px;
				border:1px solid #000;
			}
			
			#topLeft{
				height:198px;
				width:298px;
				border:1px solid #000;
				float:left;
			}
			
			#topRight{
				height:198px;
				width:298px;
				border:1px solid #000;
				float:left;
			}
			#bottom{
				height:198px;
				width:600px;
				border:1px solid #000;
			}
			#bottomLeft{
				height:198px;
				width:198px;
				border:1px solid #000;
				float:left;
			}
			
			#bottomCenter{
				height:198px;
				width:198px;
				border:1px solid #000;
				float:left;
			}
			#bottomRight{
				height:198px;
				width:198px;
				border:1px solid #000;
				float:left;
			}
			
		</style>
	</head>
	<body>
		<div id="outer">
			<div id="top">
				<div id="topLeft"></div>
				<div id="topRight"></div>
			</div>
			<div id="bottom">
				<div id="bottomLeft"></div>
				<div id="bottomCenter"></div>
				<div id="bottomRight"></div>
			</div>			
		</div>
	</body>
</html>
