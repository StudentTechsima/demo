<!doctype html>
<html>
	<head>
		<title>Student Form</title>
		<link href="form.css" rel="stylesheet">
	</head>
	<body>
		<h1>Student Form</h1>
		<hr>
		<form class="form">
			<fieldset>
				<legend>Student Info</legend>
				<label for="name">Name<span>*</span></label>
				<input type="text" placeholder="Enter your name" id="name" required/>
				<label for="mob">Mobile No<span>*</span></label>
				<input type="number" placeholder="Enter your mobile No" id="mob">
				<label for="email">Email<span>*</span> </label>
				<input type="email" placeholder="Enter Your Email">
				<label>Enroll Id</label>
				<input type="text" value="E2425000345" readonly>
				<input type="date">
				<input type="color">
				<input type="datetime-local">
				<input type="password">
				<input type="submit">
				<input type="reset">
				<input type="file">
				<input type="hidden">
				<input type="search">
				<input type="month">
			</fieldset>
			<button type="Submit">Submit</button>
			<button type="reset">Clear</button>
		</form>
	</body>
</html>
