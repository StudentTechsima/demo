<!doctype htmml>
<html>
	<head>
		<title>Float Property</title>
		<style>
			#outer{
				height:300px;
				width:600px;
				border:2px solid #000;
			}
			#box1{
				height:100px;
				width:200px;
				border:2px solid red;
				background:pink;
				float:right;
			}
			#box2{
				height:100px;
				width:200px;
				border:2px solid gold;
				background:purple;
				float:Right;
			}
		</style>
	</head>
	<body>
		<div id="outer">
			<div id="box1"></div>
			<div id="box2"></div>
		</div>
	</body>
</html>
