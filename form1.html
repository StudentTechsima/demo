<!doctype html>
<html>
	<head>
		<title>Student Form</title>
		<style>
			h1{
				text-align:center;
				color:#00f;
			}
			hr{
				color:#00f;
				height:10px;
				background:red;
			}
			textarea{
			resize:none;
			}
		
		</style>
	</head>
	<body>
		<h1>Student Form</h1>
		<hr>
		<form method="post">
			<fieldset>
				<legend>Student Record</legend>
				<input type="text" placeholder="Enter Your Name" name="name"><br><br>
				<label>Gender</label><br>
				<input type="radio" name="gender">Male  
				<input type="radio" name="gender">Female  
				<input type="radio" name="gender">Other <br><br>				
				<label >Qulification</label><br>
				<input type="checkbox" name="Quli" >HighSchool
				<input type="checkbox" name="Quli" >Intermediate 
				<input type="checkbox" name="Quli" >B.Sc.
				<input type="checkbox" name="Quli" >BA
				<input type="checkbox" name="Quli" >BCA<br><br>
				<label>City</label><br>
				<select name="city">
					<option>-----Select City----</option>
					<option>Ambedkar Nagar </option>
					<option>Ayodhya</option>
					<option>BASTI</option>
				</select><br><br>
				<label>Address:</label><br>
				<textarea name="add" rows="5" cols="30"></textarea><br><br>
				<input type="submit" value="Send Data">
				<input type="reset" value="Clear">
			</fieldset>
		</form>
	</body>
</html>
