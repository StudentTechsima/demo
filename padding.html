<!doctype html>
<html>
	<head>
		<title>margin And padding</title>
		<style>
			#box{
				height:220px;
				width:220px;
				background:red;
				color:#fff;
				Margin:10px;
				Padding:30px;
				margin:100px auto; 
			}
			
			#box1{
				height:100px;
				width:100px;
				background:teal;
				color:#fff;
				Margin:40px;
				Padding:20px;
			}
		</style>
	</head>
	<body>
		<h1 style="text-align:center;">Margin And Padding</h1>
		<hr>
		<div id="box">
			<div id="box1">Child Division</div>
			<span>Parent Division</span>
		</div>
	</body>
</html>
