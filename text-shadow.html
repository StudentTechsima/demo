<!doctype html>
<html>
	<head>
		<title>Text-shadow</title>
		<style>
			#box{
				height:200px;
				border:10px inset #11ECE2;
				text-align:center;
				line-height:200px;
				font-size:40px;
				text-transform:uppercase;
				color:#ff0; 
				Text-shadow:20px 40px 0px red;
			}
		</style>
	</head>
	<body>
		<div id="box">
			Techsima Solution Private Limited Lucknow
		</div>
	</body>
</html>
