<html>
	<head>
		<title>Box-shadow</title>
		<style>
			#box{
				height:100px;
				border:10px double #37E80F;
				padding:10px 40px;
				font-size:50px;
				text-align:center;
				line-height:100px;
				text-transform:uppercase;
				text-shadow:-2px -5px 4px red; 
				Box-shadow: 4px 4px 4px 2px #000;
			}
			
			#box1{
				height:100px;
				border:10px double #000;
				padding:10px 40px;
				font-size:50px;
				text-align:center;
				line-height:100px;
				text-transform:uppercase;
				margin-top:40px;
				text-shadow:-2px -5px 4px red; 
				Box-shadow: 0px 0px 10px 2px #000  inset;
			}
			
		</style>
	</head>
	<body>
		<div id="box">Techsima Solution Private Limited Lucknow</div>
		<div id="box1">Techsima Solution Private Limited Lucknow</div>
	</body>
</html>
