<html>
	<head>
		<title>Hover Class Selector</title>
		<style>
			.box{
				height:200px;
				width:200px;
				background:red;
				margin:100px auto;
				transition: all ease 2s;
				border:10px solid yellow;
			}
			.box:hover{
				background:#fff;
				border-radius:50%;
				border:10px double purple;
				
			}
			h1{
				background:#fff;
				border:2px solid teal;
				transition:all ease 2s;
			}
			h1:hover{
				background:teal;
				color:#fff;
				letter-spacing:5px;
				text-transform:uppercase;
			}
		</style>
	</head>
	<body>
		<div class="box"></div>
		<h1 align="center">Techsima Solution Private Limited Lucknow</h1>
	</body>
</html>
